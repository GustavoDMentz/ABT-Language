name: IDE

on:
  pull_request:
    paths: ['ide/**', '.github/workflows/ide.yml']
  push:
    branches: [main]
    paths: ['ide/**', '.github/workflows/ide.yml']

permissions:
  contents: read

jobs:
  testes:
    name: IDE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Testes da IDE
        run: python -m unittest discover -s ide -p "test_*.py" -v
