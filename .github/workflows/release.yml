name: ABT release

# Gera os pacotes do instalador integrado (Julia + ABT + pacotes) para Linux e Windows,
# testa a instalação em sistemas limpos, sem Julia, e publica ao criar uma tag vX.Y.Z.
# Execução manual: escolha a plataforma; com plataforma=windows e publicar_em=vX.Y.Z, os
# arquivos do Windows são anexados a uma release que já existe.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'Plataforma a construir e testar'
        type: choice
        options: [todas, linux, windows, depurar]
        default: todas
      rapido:
        description: 'Windows: teste reduzido (instala, roda dois exemplos e desinstala)'
        type: boolean
        default: false
      publicar_em:
        description: 'Windows: tag de uma release existente que receberá os arquivos (ex.: v0.15.0)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["todas","linux"]'), inputs.plataforma)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: A tag deve corresponder à versão de Project.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          versao=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Project.toml | head -n 1)
          test "v$versao" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Project.toml v$versao"; exit 1; }
      - name: Testes do instalador (Julia falsa)
        run: python3 -I tests/test_bundle_installer.py
      - name: Construir o pacote
        run: tools/construir_bundle.sh --saida dist
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-linux-x86_64
          path: dist/*
          if-no-files-found: error

  instalacao-limpa:
    needs: bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        imagem: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'fedora:40']
    container: ${{ matrix.imagem }}
    steps:
      - name: Dependências mínimas (sem Julia)
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq xz-utils ca-certificates fontconfig fonts-dejavu-core
          else
            dnf install -y -q xz tar which util-linux shadow-utils fontconfig dejavu-sans-fonts
          fi
          ! command -v julia
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pacote-linux-x86_64
          path: dist
      - name: Instalar como usuário comum, offline
        run: |
          useradd -m aluno
          casa=$(getent passwd aluno | cut -d: -f6)
          cp -r . "$casa/repo" && chown -R aluno "$casa/repo" dist
          chmod -R a+rX dist
          su aluno -c "sh $casa/repo/tools/instalar.sh --arquivo $PWD/dist/abt-*-linux-x86_64.tar.xz"
      - name: Executar os exemplos da documentação com a Julia embutida
        run: |
          cat > /tmp/exemplos.sh <<'EOF'
          export PATH="$HOME/.local/bin:$PATH" ABT_FIGURA_PATH=/tmp/figura.png ABT_DOC_FIGURE_PATH=/tmp/figura2.png
          cd "$HOME/repo"
          abt doctor
          falhas=0
          for f in docs/examples/*.abt; do
            n=$(basename "$f")
            abt run "$f" >/dev/null 2>/tmp/erro.txt; rc=$?
            if [ "$n" = falhar.abt ]; then esperado=1; else esperado=0; fi
            if [ "$rc" -ne "$esperado" ]; then echo "FALHA $n (rc=$rc)"; head -3 /tmp/erro.txt; falhas=$((falhas+1)); else echo "ok $n"; fi
          done
          test "$falhas" -eq 0
          abt desinstalar --sim
          test ! -e "$HOME/.local/share/abt"
          EOF
          su aluno -c "sh /tmp/exemplos.sh"

  bundle-windows:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["todas","windows"]'), inputs.plataforma)
    runs-on: windows-latest
    steps:
      # Sem conversão de fim de linha: os dados de exemplo (CSV, FASTA) devem chegar como no repositório.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: A tag deve corresponder à versão de Project.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          versao=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Project.toml | head -n 1)
          test "v$versao" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Project.toml v$versao"; exit 1; }
      - name: Construir o pacote
        shell: powershell
        run: ./tools/construir_bundle.ps1 -Saida dist
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-windows-x86_64
          path: dist/*
          if-no-files-found: error

  instalacao-windows:
    needs: bundle-windows
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pacote-windows-x86_64
          path: dist
      - name: Instalar, executar e desinstalar (Windows PowerShell 5.1, sem Julia)
        shell: powershell
        run: |
          $parametros = @{ Pacote = (Get-ChildItem dist\abt-*-windows-x86_64.zip).FullName }
          if ('${{ inputs.rapido }}' -eq 'true') { $parametros.Rapido = $true }
          & ./tests/windows_instalacao.ps1 @parametros
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  depurar-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.plataforma == 'depurar'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $p = Join-Path $env:RUNNER_TEMP ('abt instala' + [char]0xE7 + [char]0xE3 + 'o')
          New-Item -ItemType Directory $p | Out-Null
          [IO.File]::WriteAllText("$p\.abt-prefixo", $p + "`r`n", (New-Object Text.UTF8Encoding($false)))
          Get-Content "$p\.abt-prefixo" -Raw | Out-String | Write-Host
          [BitConverter]::ToString([IO.File]::ReadAllBytes("$p\.abt-prefixo")) | Write-Host
          $bat = Join-Path $env:RUNNER_TEMP 'dbg.cmd'
          $linhas = @(
            '@echo off',
            'setlocal',
            'set "P=%~1"',
            'echo A: [%P%]',
            'set "X="',
            'set /p X=<"%P%\.abt-prefixo"',
            'echo sem chcp: [%X%]',
            'chcp 65001 >nul',
            'set "X="',
            'set /p X=<"%P%\.abt-prefixo"',
            'echo com chcp: [%X%]',
            'set "X="',
            'for /f "usebackq delims=" %%L in ("%P%\.abt-prefixo") do set "X=%%L"',
            'echo com for: [%X%]',
            'type "%P%\.abt-prefixo"'
          )
          [IO.File]::WriteAllLines($bat, $linhas, [Text.Encoding]::ASCII)
          & cmd.exe /c "`"$bat`" `"$p`"" 2>&1 | Out-String | Write-Host

  publicar-windows:
    needs: instalacao-windows
    if: github.event_name == 'workflow_dispatch' && inputs.plataforma == 'windows' && inputs.publicar_em != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pacote-windows-x86_64
          path: dist
      - name: Atestar a origem do pacote
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: dist/abt-*-windows-x86_64.zip
      - name: Anexar à release existente
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.publicar_em }}
        run: |
          cp tools/instalar.ps1 dist/instalar.ps1
          (cd dist && sha256sum -c abt-*-windows-x86_64.zip.sha256)
          rm -f dist/VERSION
          gh release upload "$TAG" dist/* --clobber

  publicar:
    needs: [instalacao-limpa, instalacao-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pacote-*
          path: dist
          merge-multiple: true
      - name: Atestar a origem dos pacotes (verificável com gh attestation verify)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            dist/abt-*-linux-x86_64.tar.xz
            dist/abt-*-windows-x86_64.zip
      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tools/instalar.sh tools/instalar.ps1 dist/
          (cd dist && for f in abt-*.sha256; do sha256sum -c "$f"; done)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ABT ${GITHUB_REF_NAME#v}" \
            --notes "Instalação em um comando, com a Julia incluída. Linux x86_64: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/instalar.sh | sh\`. Windows x64 (PowerShell): \`irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/tools/instalar.ps1 | iex\`"
