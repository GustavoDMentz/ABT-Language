name: ABT documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/validate_docs.py'
      - 'tools/check_privacy.py'
      - 'tools/generate_docs_reference.py'
      - 'src/**'
      - 'applications/**'
      - 'examples/**'
      - 'bin/**'
      - 'vscode/**'
      - 'Project.toml'
      - 'Manifest.toml'
      - 'ABT.packages.toml'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/validate_docs.py'
      - 'tools/check_privacy.py'
      - 'tools/generate_docs_reference.py'
      - 'src/**'
      - 'applications/**'
      - 'examples/**'
      - 'bin/**'
      - 'vscode/**'
      - 'Project.toml'
      - 'Manifest.toml'
      - 'ABT.packages.toml'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.13.3'
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Install ABT dependencies
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'
      - name: Install documentation dependencies
        run: julia --project=docs -e 'import Pkg; Pkg.instantiate()'
      # So no CI e so para os testes opcionais da documentacao: PythonCall nao faz parte do Project.toml nem do pacote.
      - name: Install optional PythonCall for documentation tests
        env:
          JULIA_CONDAPKG_BACKEND: Null
          JULIA_PYTHONCALL_EXE: /usr/bin/python3
        run: julia --project=. -e 'import Pkg; Pkg.add(Pkg.PackageSpec(name="PythonCall", version="0.9.37"))'
      - name: Validate catalog, links, CLI and examples
        env:
          ABT_JULIA: julia
          XDG_CACHE_HOME: ${{ runner.temp }}/abt-cache
          JULIA_CONDAPKG_BACKEND: Null
          JULIA_PYTHONCALL_EXE: /usr/bin/python3
        run: python3 tools/validate_docs.py
      - name: Check tracked files for personal paths and secrets
        run: |
          python3 -I tests/test_check_privacy.py
          python3 tools/check_privacy.py
      - name: Build site
        run: julia --project=docs docs/make.jl
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  # Em PR (e fora da main) só se confere o artefato; essa tarefa não recebe permissão de escrita.
  verificar-pr:
    needs: build
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify Pages artifact on PR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Check Pages contents on PR
        run: |
          test -s pages-artifact/artifact.tar
          tar -tf pages-artifact/artifact.tar | grep -Eq '(^|/)index\.html$'
          tar -tf pages-artifact/artifact.tar | grep -Eq '(^|/)search_index\.js$'

  # Só a main publica, e só ela recebe pages: write e id-token: write.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
